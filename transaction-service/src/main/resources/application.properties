spring.application.name=transaction-service
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-32}
app.demo.username=${DEMO_USERNAME}
app.demo.password=${DEMO_PASSWORD}
app.rate-limit.transactions=${RATE_LIMIT_TRANSACTIONS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=transaction-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.pulseops.transaction_service.event.TransactionCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pulseops.transaction_service.event
app.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:3}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pulseops}
spring.datasource.username=${DB_USERNAME:pulseops}
spring.datasource.password=${DB_PASSWORD:pulseops_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
